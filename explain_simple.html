<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Global Railway - Simple Monitor</title>
  <!-- Cesium.js -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    /* Minimal CSS while keeping layout and functionality */
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; }
    :root { --sidebar-width: 260px; }

    .panel { background: rgba(0,0,0,0.7); color: #fff; padding: 8px; border-radius: 6px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #tokenOverlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #loginBox { width: 360px; text-align: center; }
    #tokenInput { width: 100%; padding: 8px; margin: 10px 0; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; }
    #startBtn { width: 100%; padding: 8px; background: #5dade2; border: none; color: #fff; border-radius: 4px; cursor: pointer; }

    #menu { position: absolute; top: 20px; left: 20px; width: var(--sidebar-width); max-height: 80vh; overflow: auto; z-index: 1000; }
    #searchInput { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; }

    #infoBar { position: absolute; bottom: 20px; left: 20px; width: var(--sidebar-width); z-index: 1000; }

    #inspectPanel { position: absolute; bottom: 20px; left: calc(var(--sidebar-width) + 40px); width: 300px; z-index: 1000; display: none; }
    #inspectPanel.active { display: block; }
    .inspect-close { float: right; cursor: pointer; color: #5dade2; }

    #compassContainer, #customHomeBtn, #hudToggle { position: absolute; right: 20px; width: 44px; height: 44px; z-index: 1000; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    #compassContainer { top: 80px; }
    #customHomeBtn { top: 140px; }
    #hudToggle { bottom: 120px; }

    .label { font-size: 12px; color: #5dade2; font-weight: 600; margin-top: 8px; margin-bottom: 4px; }
    .switch-container { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
    select, input[type="range"] { width: 100%; margin-bottom: 6px; }
    .info-item { display: flex; justify-content: space-between; margin-bottom: 4px; color: #ccc; }
    .info-val { color: #fff; font-weight: bold; }

    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .hud-hidden #menu, .hud-hidden #infoBar, .hud-hidden #inspectPanel { display: none !important; }
  </style>
</head>
<body>

  <!-- Token overlay -->
  <div id="tokenOverlay">
    <div id="loginBox" class="panel">
      <h3 style="color:#5dade2; letter-spacing: 2px; margin: 0 0 8px 0;">RAILWAY MONITOR</h3>
      <input type="password" id="tokenInput" placeholder="Paste your token here...">
      <button id="startBtn">INITIALIZE SYSTEM</button>
    </div>
  </div>

  <div id="cesiumContainer"></div>

  <div id="compassContainer" title="Reset North" class="panel">
    <svg viewBox="0 0 100 100" style="width: 70%; height: 70%;">
      <circle cx="50" cy="50" r="45" stroke="#fff" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M50,15 L60,50 L50,45 L40,50 Z" fill="#f1948a"/>
      <path d="M50,85 L60,50 L50,55 L40,50 Z" fill="#5dade2"/>
    </svg>
  </div>

  <div id="customHomeBtn" title="Reset Height (Vertical Only)" class="panel">🏠</div>
  <div id="hudToggle" class="panel">🛰️</div>

  <div id="menu" class="panel">
    <input type="text" id="searchInput" placeholder="Station Search (Enter)..." autocomplete="off">

    <div class="label">System Control</div>
    <div class="switch-container"><span>Auto-Rotation</span><label><input type="checkbox" id="rotateToggle"></label></div>
    <div class="switch-container"><span>Inspector Mode</span><label><input type="checkbox" id="inspectToggle"></label></div>

    <div class="label">Visuals</div>
    <div class="switch-container"><span>3D Buildings</span><label><input type="checkbox" id="buildingToggle"></label></div>
    <div class="switch-container"><span>3D Terrain</span><label><input type="checkbox" id="terrainToggle"></label></div>
    <div class="switch-container"><span>Lighting</span><label><input type="checkbox" id="lightToggle"></label></div>

    <div class="label">Basemap Saturation <span id="baseSatVal" style="float:right; color:#fff;">100%</span></div>
    <input type="range" id="baseSatSlider" min="0" max="3" step="0.1" value="1.0">

    <div class="label">Railway Saturation <span id="railSatVal" style="float:right; color:#fff;">100%</span></div>
    <input type="range" id="railSatSlider" min="0" max="3" step="0.1" value="1.0">

    <div class="label">Railway Map</div>
    <select id="railwaySelect">
      <option value="standard">Infrastructure</option>
      <option value="maxspeed">Max speeds</option>
      <option value="signals">Signalling</option>
      <option value="electrification">Electrification</option>
      <option value="gauge">Gauge</option>
    </select>

    <div class="label">Base Map</div>
    <select id="baseSelect">
      <option value="osm">OpenStreetMap</option>
      <option value="dark">ArcGIS Dark Gray</option>
      <option value="arc_std">ArcGIS Street Map</option>
      <option value="arc_sat">ArcGIS Satellite</option>
      <option value="ion_sat">Cesium Ion Aerial</option>
    </select>
  </div>

  <div id="infoBar" class="panel">
    <div class="info-item"><span style="color:#5dade2">SOLAR TIME</span><span id="timeVal" class="info-val">--:--:--</span></div>
    <div class="info-item">TIMEZONE<span id="tzVal" class="info-val">UTC +0</span></div>
    <div class="info-item">LATITUDE<span id="latVal" class="info-val">0.00°</span></div>
    <div class="info-item">LONGITUDE<span id="lonVal" class="info-val">0.00°</span></div>
    <div class="info-item">ALTITUDE<span id="altVal" class="info-val">--</span></div>
    <div style="margin-top:10px;">
      <div id="scaleLabel" style="font-size: 12px; color: #5dade2; font-weight: bold;">-- KM</div>
      <div id="scaleBar" style="height:2px; background:#fff; width:80px; margin-top:4px;"></div>
    </div>
  </div>

  <div id="inspectPanel" class="panel">
    <div class="inspect-close" id="inspectClose">←</div>
    <div class="inspect-title">RAILWAY INSPECTOR</div>
    <div id="inspectContent"></div>
  </div>

  <script>
    // Preserve original JS functionality; only layout/CSS simplified.
    const startBtn = document.getElementById('startBtn');
    startBtn.onclick = () => {
      const token = document.getElementById('tokenInput').value.trim();
      if (token) initSystem(token);
    };

    async function initSystem(token) {
      Cesium.Ion.defaultAccessToken = token;
      try {
        const viewer = new Cesium.Viewer('cesiumContainer', {
          baseLayerPicker: false, geocoder: false, homeButton: false, infoBox: false,
          timeline: false, animation: false, baseLayer: false,
          terrainProvider: new Cesium.EllipsoidTerrainProvider()
        });

        const DEFAULT_HEIGHT = 20000000.0;
        let baseLayer = null, railLayer = null, buildingLayer = null;
        let isRotating = false, cachedTerrain = null, activeController = null;

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keypress', async (e) => {
          if (e.key === 'Enter') {
            const query = searchInput.value.trim();
            if (!query) return;
            searchInput.disabled = true;
            try {
              const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' station')}&limit=1`);
              const data = await response.json();
              if (data && data.length > 0) {
                const { lat, lon } = data[0];
                const destination = Cesium.Cartesian3.fromDegrees(parseFloat(lon), parseFloat(lat));
                viewer.entities.removeAll();
                viewer.entities.add({ position: destination, point: { pixelSize: 12, color: Cesium.Color.fromCssColorString('#5dade2'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2 } });
                viewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(parseFloat(lon), parseFloat(lat), 15000), orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 } });
                searchInput.value = '';
                searchInput.blur();
              } else { searchInput.style.borderColor = '#f1948a'; setTimeout(() => searchInput.style.borderColor = '', 1000); }
            } catch (err) { console.error(err); } finally { searchInput.disabled = false; }
          }
        });

        viewer.screenSpaceEventHandler.setInputAction(() => { viewer.entities.removeAll(); }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        document.getElementById('customHomeBtn').onclick = () => {
          const cp = viewer.camera.positionCartographic;
          viewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(Cesium.Math.toDegrees(cp.longitude), Cesium.Math.toDegrees(cp.latitude), DEFAULT_HEIGHT), orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 } });
        };

        document.getElementById('buildingToggle').onchange = async (e) => { if (e.target.checked) { if (!buildingLayer) buildingLayer = await Cesium.Cesium3DTileset.fromIonAssetId(96188); viewer.scene.primitives.add(buildingLayer); } else if (buildingLayer) viewer.scene.primitives.remove(buildingLayer); };

        document.getElementById('lightToggle').onchange = (e) => { viewer.scene.globe.enableLighting = e.target.checked; viewer.scene.shadowMap.enabled = e.target.checked; };

        document.getElementById('compassContainer').onclick = () => { viewer.camera.flyTo({ destination: viewer.camera.position, orientation: { heading: 0.0, pitch: viewer.camera.pitch, roll: 0.0 } }); };

        const bSatS = document.getElementById('baseSatSlider');
        const rSatS = document.getElementById('railSatSlider');
        const updateBaseSat = () => { if (baseLayer) baseLayer.saturation = parseFloat(bSatS.value); };
        const updateRailSat = () => { if (railLayer) railLayer.saturation = parseFloat(rSatS.value); };
        bSatS.oninput = (e) => { document.getElementById('baseSatVal').innerText = `${Math.round(e.target.value * 100)}%`; clearTimeout(window.bt); window.bt = setTimeout(updateBaseSat, 200); };
        rSatS.oninput = (e) => { document.getElementById('railSatVal').innerText = `${Math.round(e.target.value * 100)}%`; clearTimeout(window.rt); window.rt = setTimeout(updateRailSat, 200); };

        async function updateBaseMap(type) {
          if (baseLayer) viewer.imageryLayers.remove(baseLayer);
          let p;
          switch(type) {
            case 'osm': p = new Cesium.OpenStreetMapImageryProvider({ url: 'https://a.tile.openstreetmap.org/' }); break;
            case 'dark': p = await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer'); break;
            case 'arc_std': p = await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/arcgis/rest/services/World_Street_Map/MapServer'); break;
            case 'arc_sat': p = await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer'); break;
            case 'ion_sat': p = await Cesium.createWorldImageryAsync(); break;
          }
          baseLayer = viewer.imageryLayers.addImageryProvider(p, 0);
          updateBaseSat();
        }

        function loadRailway(style) { if (railLayer) viewer.imageryLayers.remove(railLayer); railLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({ url: `https://{s}.tiles.openrailwaymap.org/${style}/{z}/{x}/{y}.png`, subdomains: ['a','b','c'] })); updateRailSat(); }

        const inspectToggle = document.getElementById('inspectToggle');
        const inspectPanel = document.getElementById('inspectPanel');
        const inspectContent = document.getElementById('inspectContent');
        const inspectClose = document.getElementById('inspectClose');
        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

        handler.setInputAction(async (click) => {
          if (!inspectToggle.checked) return; if (activeController) activeController.abort(); activeController = new AbortController();
          let cartesian = viewer.scene.pickPosition(click.position); if (!Cesium.defined(cartesian)) cartesian = viewer.camera.pickEllipsoid(click.position); if (!Cesium.defined(cartesian)) return;
          const carto = Cesium.Cartographic.fromCartesian(cartesian);
          const lat = Cesium.Math.toDegrees(carto.latitude).toFixed(6); const lon = Cesium.Math.toDegrees(carto.longitude).toFixed(6);
          inspectPanel.classList.add('active'); inspectContent.innerHTML = `<div style="color:#5dade2; animation: pulse 1s infinite;">📡 Querying OSM Database...</div>`;
          try {
            const radius = Math.min(500, Math.max(50, Math.round(viewer.camera.positionCartographic.height / 800)));
            const query = `[out:json][timeout:15];way(around:${radius},${lat},${lon})[railway];out tags center;`;
            const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`, { signal: activeController.signal });
            if (res.status === 429) { inspectContent.innerHTML = `<div style="color:#f1948a">Server Busy (429).<br>Please wait a moment.</div>`; return; }
            const data = await res.json(); const element = data?.elements?.[0]; const tags = element?.tags;
            if (!tags) { inspectContent.innerHTML = `<div style="color:#888">No railway data found within ${radius}m.</div>`; }
            else {
              inspectContent.innerHTML = `\n                <div class="inspect-data"><span class="inspect-label">Infrastructure</span>${tags.name || tags.railway || 'Unknown Track'}</div>\n                <div class="inspect-data"><span class="inspect-label">Usage / Type</span>${tags.usage || 'N/A'} / ${tags.service || 'N/A'}</div>\n                <div class="inspect-data"><span class="inspect-label">Max Speed</span>${tags.maxspeed ? tags.maxspeed + ' km/h' : 'N/A'}</div>\n                <div class="inspect-data"><span class="inspect-label">Signalling</span>${tags['railway:signal:main'] || tags['railway:control_command_and_signalling'] || 'Standard'}</div>\n                <div class="inspect-data"><span class="inspect-label">Electrification</span>${tags.electrified || 'None'}</div>\n                <div class="inspect-data"><span class="inspect-label">Gauge</span>${tags.gauge || '1435'} mm</div>\n                <div style="font-size:10px; color:#ccc; margin-top:5px;">ID: ${element.id} | R: ${radius}m</div>`;
            }
          } catch (e) { if (e.name === 'AbortError') return; inspectContent.innerHTML = `<div style="color:#f1948a">Connection Error.</div>`; }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        inspectClose.onclick = () => { inspectPanel.classList.remove('active'); };

        function updateHUD() {
          const c = viewer.camera.positionCartographic; if (!c) return;
          const lat = Cesium.Math.toDegrees(c.latitude), lon = Cesium.Math.toDegrees(c.longitude);
          const utcOffset = Math.round(lon / 15); const now = new Date(); const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          const solarDate = new Date(utc + (3600000 * utcOffset));
          document.getElementById('timeVal').innerText = solarDate.toTimeString().split(' ')[0];
          document.getElementById('tzVal').innerText = `UTC ${utcOffset >= 0 ? '+' : ''}${utcOffset}`;
          document.getElementById('latVal').innerText = `${lat.toFixed(4)}°`;
          document.getElementById('lonVal').innerText = `${lon.toFixed(4)}°`;
          document.getElementById('altVal').innerText = `${(c.height/1000).toFixed(1)} km`;
          document.getElementById('compassContainer').style.transform = `rotate(${-Cesium.Math.toDegrees(viewer.camera.heading)}deg)`;
          const leftPos = viewer.camera.pickEllipsoid(new Cesium.Cartesian2(0, viewer.scene.canvas.clientHeight / 2));
          const rightPos = viewer.camera.pickEllipsoid(new Cesium.Cartesian2(80, viewer.scene.canvas.clientHeight / 2));
          if (leftPos && rightPos) { const distance = Cesium.Cartesian3.distance(leftPos, rightPos) / 1000; document.getElementById('scaleLabel').innerText = distance > 1 ? `${distance.toFixed(1)} KM` : `${(distance*1000).toFixed(0)} M`; }
        }
        viewer.scene.preRender.addEventListener(updateHUD);

        document.getElementById('baseSelect').onchange = (e) => updateBaseMap(e.target.value);
        document.getElementById('railwaySelect').onchange = (e) => loadRailway(e.target.value);
        document.getElementById('rotateToggle').onchange = (e) => isRotating = e.target.checked;
        document.getElementById('hudToggle').onclick = () => document.body.classList.toggle('hud-hidden');

        document.getElementById('terrainToggle').onchange = async (e) => { if (e.target.checked) { if(!cachedTerrain) cachedTerrain = await Cesium.createWorldTerrainAsync(); viewer.terrainProvider = cachedTerrain; } else viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider(); };

        viewer.scene.postUpdate.addEventListener(() => { if (isRotating) viewer.camera.rotate(Cesium.Cartesian3.UNIT_Z, 0.001); });

        document.getElementById('tokenOverlay').style.display = 'none';
        await updateBaseMap('osm');
        loadRailway('standard');
        viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(0, 0, DEFAULT_HEIGHT), orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 } });

      } catch (e) { console.error(e); }
    }
  </script>
</body>
</html>
