<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Global Railway - Simple Monitor</title>
  <!-- Cesium.js -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    /* Minimal CSS while keeping layout and functionality */
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; }
    :root { --sidebar-width: 260px; }

    .panel { background: rgba(0,0,0,0.7); color: #fff; padding: 8px; border-radius: 6px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #tokenOverlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #loginBox { width: 360px; text-align: center; }
    #tokenInput { width: 100%; padding: 8px; margin: 10px 0; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; }
    #startBtn { width: 100%; padding: 8px; background: #5dade2; border: none; color: #fff; border-radius: 4px; cursor: pointer; box-sizing: border-box; }

    #menu { position: absolute; top: 20px; left: 20px; width: var(--sidebar-width); max-height: 80vh; overflow: auto; z-index: 1000; }
    #searchInput { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; }

    #infoBar { position: absolute; bottom: 20px; left: 20px; width: var(--sidebar-width); z-index: 1000; }

    #inspectPanel { position: absolute; bottom: 20px; left: calc(var(--sidebar-width) + 40px); width: 300px; z-index: 1000; display: none; }
    #inspectPanel.active { display: block; }
    .inspect-close { float: right; cursor: pointer; color: #5dade2; }

    #compassContainer, #customHomeBtn, #hudToggle { position: absolute; right: 20px; width: 44px; height: 44px; z-index: 1000; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    #compassContainer { top: 80px; }
    #customHomeBtn { top: 140px; }
    #hudToggle { bottom: 120px; }

    .label { font-size: 12px; color: #5dade2; font-weight: 600; margin-top: 8px; margin-bottom: 4px; }
    .switch-container { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
    select, input[type="range"] { width: 100%; margin-bottom: 6px; box-sizing: border-box; }
    .info-item { display: flex; justify-content: space-between; margin-bottom: 4px; color: #ccc; }
    .info-val { color: #fff; font-weight: bold; }

    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .hud-hidden #menu, .hud-hidden #infoBar, .hud-hidden #inspectPanel { display: none !important; }
  </style>
</head>
<body>

  <!-- Token overlay -->
  <div id="tokenOverlay">
    <div id="loginBox" class="panel">
      <h3 style="color:#5dade2; letter-spacing: 2px; margin: 0 0 8px 0;">RAILWAY MONITOR</h3>
      <input type="password" id="tokenInput" placeholder="Paste your token here...">
      <button id="startBtn">INITIALIZE SYSTEM</button>
    </div>
  </div>

  <div id="cesiumContainer"></div>

  <div id="compassContainer" title="Reset North" class="panel">
    <svg viewBox="0 0 100 100" style="width: 70%; height: 70%;">
      <circle cx="50" cy="50" r="45" stroke="#fff" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M50,15 L60,50 L50,45 L40,50 Z" fill="#f1948a"/>
      <path d="M50,85 L60,50 L50,55 L40,50 Z" fill="#5dade2"/>
    </svg>
  </div>

  <div id="customHomeBtn" title="Reset Height (Vertical Only)" class="panel">🏠</div>
  <div id="hudToggle" class="panel">🛰️</div>

  <div id="menu" class="panel">
    <input type="text" id="searchInput" placeholder="Station Search (Enter)..." autocomplete="off">

    <div class="label">System Control</div>
    <div class="switch-container"><span>Auto-Rotation</span><label><input type="checkbox" id="rotateToggle"></label></div>
    <div class="switch-container"><span>Inspector Mode</span><label><input type="checkbox" id="inspectToggle"></label></div>

    <div class="label">Visuals</div>
    <div class="switch-container"><span>3D Buildings</span><label><input type="checkbox" id="buildingToggle"></label></div>
    <div class="switch-container"><span>3D Terrain</span><label><input type="checkbox" id="terrainToggle"></label></div>
    <div class="switch-container"><span>Lighting</span><label><input type="checkbox" id="lightToggle"></label></div>

    <div class="label">Basemap Saturation <span id="baseSatVal" style="float:right; color:#fff;">100%</span></div>
    <input type="range" id="baseSatSlider" min="0" max="3" step="0.1" value="1.0">

    <div class="label">Railway Saturation <span id="railSatVal" style="float:right; color:#fff;">100%</span></div>
    <input type="range" id="railSatSlider" min="0" max="3" step="0.1" value="1.0">

    <div class="label">Railway Map</div>
    <select id="railwaySelect">
      <option value="standard">Infrastructure</option>
      <option value="maxspeed">Max speeds</option>
      <option value="signals">Signalling</option>
      <option value="electrification">Electrification</option>
      <option value="gauge">Gauge</option>
    </select>

    <div class="label">Base Map</div>
    <select id="baseSelect">
      <option value="osm">OpenStreetMap</option>
      <option value="dark">ArcGIS Dark Gray</option>
      <option value="arc_std">ArcGIS Street Map</option>
      <option value="arc_sat">ArcGIS Satellite</option>
      <option value="ion_sat">Cesium Ion Aerial</option>
    </select>
  </div>

  <div id="infoBar" class="panel">
    <div class="info-item"><span style="color:#5dade2">SOLAR TIME</span><span id="timeVal" class="info-val">--:--:--</span></div>
    <div class="info-item">TIMEZONE<span id="tzVal" class="info-val">UTC +0</span></div>
    <div class="info-item">LATITUDE<span id="latVal" class="info-val">0.00°</span></div>
    <div class="info-item">LONGITUDE<span id="lonVal" class="info-val">0.00°</span></div>
    <div class="info-item">ALTITUDE<span id="altVal" class="info-val">--</span></div>
    <div style="margin-top:10px;">
      <div id="scaleLabel" style="font-size: 12px; color: #5dade2; font-weight: bold;">-- KM</div>
      <div id="scaleBar" style="height:2px; background:#fff; width:80px; margin-top:4px;"></div>
    </div>
  </div>

  <div id="inspectPanel" class="panel">
    <div class="inspect-close" id="inspectClose">←</div>
    <div class="inspect-title">RAILWAY INSPECTOR</div>
    <div id="inspectContent"></div>
  </div>

  <script>
    // ===== RAILWAY MONITOR APPLICATION =====
    
    const APP = {
      // Constants
      DEFAULT_HEIGHT: 20000000.0,
      PRIMARY_COLOR: '#5dade2',
      ACCENT_COLOR: '#f1948a',
      OSM_RADIUS_RANGE: { min: 50, max: 500 },
      
      // State
      viewer: null,
      layers: { base: null, rail: null, building: null, cachedTerrain: null },
      ui: { isRotating: false, activeController: null },
      
      // Initialize app
      async init() {
        const token = document.getElementById('tokenInput').value.trim();
        if (token) this.initSystem(token);
      },
      
      // System initialization
      async initSystem(token) {
        try {
          Cesium.Ion.defaultAccessToken = token;
          this.viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            timeline: false,
            animation: false,
            baseLayer: false,
            terrainProvider: new Cesium.EllipsoidTerrainProvider()
          });
          
          // Initialize UI and features
          this.setupEventHandlers();
          this.setupSearch();
          this.setupInspector();
          this.setupHUD();
          
          // Load default layers
          document.getElementById('tokenOverlay').style.display = 'none';
          await this.updateBaseMap('osm');
          this.loadRailway('standard');
          
          // Set initial camera position
          this.viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(0, 0, this.DEFAULT_HEIGHT),
            orientation: {
              heading: 0,
              pitch: Cesium.Math.toRadians(-90),
              roll: 0
            }
          });
        } catch (error) {
          console.error('System initialization failed:', error);
        }
      },
      
      // ===== EVENT HANDLERS =====
      
      setupEventHandlers() {
        // Compass - Reset North
        document.getElementById('compassContainer').onclick = () => {
          this.viewer.camera.flyTo({
            destination: this.viewer.camera.position,
            orientation: {
              heading: 0.0,
              pitch: this.viewer.camera.pitch,
              roll: 0.0
            }
          });
        };
        
        // Home Button - Reset Height
        document.getElementById('customHomeBtn').onclick = () => {
          const cp = this.viewer.camera.positionCartographic;
          this.viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(
              Cesium.Math.toDegrees(cp.longitude),
              Cesium.Math.toDegrees(cp.latitude),
              this.DEFAULT_HEIGHT
            ),
            orientation: {
              heading: 0,
              pitch: Cesium.Math.toRadians(-90),
              roll: 0
            }
          });
        };
        
        // HUD Toggle
        document.getElementById('hudToggle').onclick = () => {
          document.body.classList.toggle('hud-hidden');
        };
        
        // Map selection
        document.getElementById('baseSelect').onchange = (e) => {
          this.updateBaseMap(e.target.value);
        };
        
        document.getElementById('railwaySelect').onchange = (e) => {
          this.loadRailway(e.target.value);
        };
        
        // Visual toggles
        document.getElementById('buildingToggle').onchange = (e) => {
          this.toggleBuildings(e.target.checked);
        };
        
        document.getElementById('lightToggle').onchange = (e) => {
          this.viewer.scene.globe.enableLighting = e.target.checked;
          this.viewer.scene.shadowMap.enabled = e.target.checked;
        };
        
        document.getElementById('terrainToggle').onchange = (e) => {
          this.toggleTerrain(e.target.checked);
        };
        
        // Rotation toggle
        document.getElementById('rotateToggle').onchange = (e) => {
          this.ui.isRotating = e.target.checked;
        };
        
        // Saturation sliders
        this.setupSaturationSliders();
        
        // Click to clear entities
        this.viewer.screenSpaceEventHandler.setInputAction(() => {
          this.viewer.entities.removeAll();
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
        
        // Animation loop
        this.viewer.scene.postUpdate.addEventListener(() => {
          if (this.ui.isRotating) {
            this.viewer.camera.rotate(Cesium.Cartesian3.UNIT_Z, 0.001);
          }
        });
      },
      
      setupSaturationSliders() {
        const baseSatSlider = document.getElementById('baseSatSlider');
        const railSatSlider = document.getElementById('railSatSlider');
        
        baseSatSlider.oninput = (e) => {
          const value = e.target.value;
          document.getElementById('baseSatVal').innerText = `${Math.round(value * 100)}%`;
          clearTimeout(window.baseSatTimeout);
          window.baseSatTimeout = setTimeout(() => this.updateBaseSaturation(value), 200);
        };
        
        railSatSlider.oninput = (e) => {
          const value = e.target.value;
          document.getElementById('railSatVal').innerText = `${Math.round(value * 100)}%`;
          clearTimeout(window.railSatTimeout);
          window.railSatTimeout = setTimeout(() => this.updateRailSaturation(value), 200);
        };
      },
      
      // ===== SEARCH FUNCTIONALITY =====
      
      setupSearch() {
        document.getElementById('searchInput').addEventListener('keypress', async (e) => {
          if (e.key !== 'Enter') return;
          
          const query = e.target.value.trim();
          if (!query) return;
          
          await this.performStationSearch(query, e.target);
        });
      },
      
      async performStationSearch(query, inputElement) {
        inputElement.disabled = true;
        
        try {
          const response = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' station')}&limit=1`
          );
          const data = await response.json();
          
          if (data && data.length > 0) {
            const { lat, lon } = data[0];
            this.flyToLocation(parseFloat(lon), parseFloat(lat));
            inputElement.value = '';
            inputElement.blur();
          } else {
            this.showSearchError(inputElement);
          }
        } catch (error) {
          console.error('Search error:', error);
        } finally {
          inputElement.disabled = false;
        }
      },
      
      flyToLocation(lon, lat) {
        this.viewer.entities.removeAll();
        this.viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(lon, lat),
          point: {
            pixelSize: 12,
            color: Cesium.Color.fromCssColorString(this.PRIMARY_COLOR),
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2
          }
        });
        
        this.viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(lon, lat, 15000),
          orientation: {
            heading: 0,
            pitch: Cesium.Math.toRadians(-90),
            roll: 0
          }
        });
      },
      
      showSearchError(inputElement) {
        inputElement.style.borderColor = this.ACCENT_COLOR;
        setTimeout(() => (inputElement.style.borderColor = ''), 1000);
      },
      
      // ===== BASEMAP MANAGEMENT =====
      
      async updateBaseMap(type) {
        if (this.layers.base) {
          this.viewer.imageryLayers.remove(this.layers.base);
        }
        
        let provider;
        
        switch(type) {
          case 'osm':
            provider = new Cesium.OpenStreetMapImageryProvider({
              url: 'https://a.tile.openstreetmap.org/'
            });
            break;
          case 'dark':
            provider = await Cesium.ArcGisMapServerImageryProvider.fromUrl(
              'https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer'
            );
            break;
          case 'arc_std':
            provider = await Cesium.ArcGisMapServerImageryProvider.fromUrl(
              'https://services.arcgisonline.com/arcgis/rest/services/World_Street_Map/MapServer'
            );
            break;
          case 'arc_sat':
            provider = await Cesium.ArcGisMapServerImageryProvider.fromUrl(
              'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer'
            );
            break;
          case 'ion_sat':
            provider = await Cesium.createWorldImageryAsync();
            break;
        }
        
        this.layers.base = this.viewer.imageryLayers.addImageryProvider(provider, 0);
        this.updateBaseSaturation(document.getElementById('baseSatSlider').value);
      },
      
      updateBaseSaturation(value) {
        if (this.layers.base) {
          this.layers.base.saturation = parseFloat(value);
        }
      },
      
      // ===== RAILWAY LAYER MANAGEMENT =====
      
      loadRailway(style) {
        if (this.layers.rail) {
          this.viewer.imageryLayers.remove(this.layers.rail);
        }
        
        const urls = {
          standard: 'https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',
          maxspeed: 'https://tiles.openrailwaymap.org/maxspeed/{z}/{x}/{y}.png',
          signals: 'https://tiles.openrailwaymap.org/signals/{z}/{x}/{y}.png',
          electrification: 'https://tiles.openrailwaymap.org/electrified/{z}/{x}/{y}.png',
          gauge: 'https://tiles.openrailwaymap.org/gauge/{z}/{x}/{y}.png'
        };
        
        this.layers.rail = this.viewer.imageryLayers.addImageryProvider(
          new Cesium.UrlTemplateImageryProvider({
            url: urls[style] || urls.standard
          })
        );
        
        this.updateRailSaturation(document.getElementById('railSatSlider').value);
      },
      
      updateRailSaturation(value) {
        if (this.layers.rail) {
          this.layers.rail.saturation = parseFloat(value);
        }
      },
      
      // ===== 3D FEATURES =====
      
      async toggleBuildings(enabled) {
        if (enabled) {
          if (!this.layers.building) {
            this.layers.building = await Cesium.Cesium3DTileset.fromIonAssetId(96188);
          }
          this.viewer.scene.primitives.add(this.layers.building);
        } else if (this.layers.building) {
          this.viewer.scene.primitives.remove(this.layers.building);
        }
      },
      
      async toggleTerrain(enabled) {
        if (enabled) {
          if (!this.layers.cachedTerrain) {
            this.layers.cachedTerrain = await Cesium.createWorldTerrainAsync();
          }
          this.viewer.terrainProvider = this.layers.cachedTerrain;
        } else {
          this.viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
        }
      },
      
      // ===== INSPECTOR =====
      
      setupInspector() {
        const inspectToggle = document.getElementById('inspectToggle');
        const inspectPanel = document.getElementById('inspectPanel');
        const inspectContent = document.getElementById('inspectContent');
        const inspectClose = document.getElementById('inspectClose');
        
        const handler = new Cesium.ScreenSpaceEventHandler(this.viewer.scene.canvas);
        
        handler.setInputAction(async (click) => {
          if (!inspectToggle.checked) return;
          
          if (this.ui.activeController) {
            this.ui.activeController.abort();
          }
          
          this.ui.activeController = new AbortController();
          
          let cartesian = this.viewer.scene.pickPosition(click.position);
          if (!Cesium.defined(cartesian)) {
            cartesian = this.viewer.camera.pickEllipsoid(click.position);
          }
          if (!Cesium.defined(cartesian)) return;
          
          const carto = Cesium.Cartographic.fromCartesian(cartesian);
          const lat = Cesium.Math.toDegrees(carto.latitude).toFixed(6);
          const lon = Cesium.Math.toDegrees(carto.longitude).toFixed(6);
          
          inspectPanel.classList.add('active');
          inspectContent.innerHTML = '<div style="color:#5dade2; animation: pulse 1s infinite;">📡 Querying OSM Database...</div>';
          
          try {
            const height = this.viewer.camera.positionCartographic.height;
            const radius = Math.min(
              this.OSM_RADIUS_RANGE.max,
              Math.max(this.OSM_RADIUS_RANGE.min, Math.round(height / 800))
            );
            
            const query = `[out:json][timeout:15];way(around:${radius},${lat},${lon})[railway];out tags center;`;
            const response = await fetch(
              `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`,
              { signal: this.ui.activeController.signal }
            );
            
            if (response.status === 429) {
              inspectContent.innerHTML = '<div style="color:#f1948a">Server Busy (429).<br>Please wait a moment.</div>';
              return;
            }
            
            const data = await response.json();
            const element = data?.elements?.[0];
            const tags = element?.tags;
            
            if (!tags) {
              inspectContent.innerHTML = `<div style="color:#888">No railway data found within ${radius}m.</div>`;
            } else {
              inspectContent.innerHTML = `<div class="inspect-data"><span class="inspect-label">Infrastructure</span>${tags.name || tags.railway || 'Unknown Track'}</div>`;
            }
          } catch (error) {
            if (error.name === 'AbortError') return;
            inspectContent.innerHTML = '<div style="color:#f1948a">Connection Error.</div>';
          }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
        
        inspectClose.onclick = () => {
          inspectPanel.classList.remove('active');
        };
      },
      
      // ===== HUD & DISPLAY =====
      
      setupHUD() {
        this.viewer.scene.preRender.addEventListener(() => this.updateHUD());
      },
      
      updateHUD() {
        const c = this.viewer.camera.positionCartographic;
        if (!c) return;
        
        const lat = Cesium.Math.toDegrees(c.latitude);
        const lon = Cesium.Math.toDegrees(c.longitude);
        const utcOffset = Math.round(lon / 15);
        
        // Calculate solar time
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const solarDate = new Date(utc + (3600000 * utcOffset));
        
        // Update display elements
        document.getElementById('timeVal').innerText = solarDate.toTimeString().split(' ')[0];
        document.getElementById('tzVal').innerText = `UTC ${utcOffset >= 0 ? '+' : ''}${utcOffset}`;
        document.getElementById('latVal').innerText = `${lat.toFixed(4)}°`;
        document.getElementById('lonVal').innerText = `${lon.toFixed(4)}°`;
        document.getElementById('altVal').innerText = `${(c.height / 1000).toFixed(1)} km`;
        
        // Update compass rotation
        document.getElementById('compassContainer').style.transform = 
          `rotate(${-Cesium.Math.toDegrees(this.viewer.camera.heading)}deg)`;
        
        // Update scale bar
        this.updateScaleBar();
      },
      
      updateScaleBar() {
        const leftPos = this.viewer.camera.pickEllipsoid(
          new Cesium.Cartesian2(0, this.viewer.scene.canvas.clientHeight / 2)
        );
        const rightPos = this.viewer.camera.pickEllipsoid(
          new Cesium.Cartesian2(80, this.viewer.scene.canvas.clientHeight / 2)
        );
        
        if (leftPos && rightPos) {
          const distance = Cesium.Cartesian3.distance(leftPos, rightPos) / 1000;
          const label = distance > 1 ? `${distance.toFixed(1)} KM` : `${(distance * 1000).toFixed(0)} M`;
          document.getElementById('scaleLabel').innerText = label;
        }
      }
    };
    
    // ===== INITIALIZATION =====
    
    document.getElementById('startBtn').onclick = () => APP.init();
  </script>
</body>
</html>
